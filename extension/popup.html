<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markbook Note</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      min-height: 540px;
      max-height: 600px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090a0f;
      color: #f1f5f9;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .plan-tag {
      font-size: 11px;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }

    /* Mode Segment Box */
    .mode-box {
      background: #11121b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .mode-segment {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .mode-btn {
      flex: 1;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      border-radius: 8px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .mode-btn.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: #6366f1;
      color: #ffffff;
    }
    .mode-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      padding: 2px 4px;
    }

    /* Buttons */
    .btn {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover { background: #4338ca; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-clone {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: 1px solid rgba(167, 139, 250, 0.35);
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
      padding: 10px 12px;
    }
    .btn-clone:hover {
      background: linear-gradient(135deg, #6d28d9, #4338ca);
      box-shadow: 0 4px 18px rgba(124, 58, 237, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

    .search-input {
      width: 100%;
      background: #11121b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 7px 10px;
      color: #f1f5f9;
      font-size: 11px;
      margin-bottom: 8px;
      outline: none;
    }
    .search-input:focus { border-color: #6366f1; }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #94a3b8;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: #6366f1;
      color: #c7d2fe;
    }

    .recent-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .convo-item {
      padding: 9px 10px;
      background: #11121b;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .convo-item:hover {
      border-color: rgba(99, 102, 241, 0.4);
      background: #151724;
    }
    .convo-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
      margin-bottom: 3px;
    }
    .convo-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
      font-family: monospace;
    }

    /* Inspector */
    .inspector {
      display: none;
      background: #090a0f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .inspector.open { display: block; }
    .msg-box {
      max-height: 180px;
      overflow-y: auto;
      font-size: 11px;
      background: #11121b;
      padding: 8px;
      border-radius: 6px;
      margin: 8px 0;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .footer {
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .footer a { color: #818cf8; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* Account Bar */
    .account-bar {
      background: #11121b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .auth-drawer {
      display: none;
      background: #11121b;
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .auth-drawer.open { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <span>Markbook Note</span>
    </div>
    <span class="plan-tag" id="planBadge">Free (100 Cap)</span>
  </div>

  <!-- User Account & Vault Sync Bar -->
  <div class="account-bar" id="accountBar">
    <div id="accountUserDisplay" style="display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 230px;">
      <span style="color: #94a3b8;">Guest Vault</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <button id="authToggleBtn" style="background: rgba(99, 102, 241, 0.2); border: 1px solid #6366f1; color: #c7d2fe; padding: 3px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-weight: 600;">Sign In</button>
      <button id="restoreVaultBtn" style="background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 3px 8px; border-radius: 6px; font-size: 10px; cursor: pointer;" title="Restore chats from Web Dashboard">🔄 Restore</button>
    </div>
  </div>

  <!-- Quick Auth Drawer -->
  <div class="auth-drawer" id="authDrawer">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-weight: 700; color: #fff; font-size: 12px;">Sign In to Markbook Note</span>
      <button id="closeAuthBtn" style="background: transparent; border: none; color: #94a3b8; cursor: pointer;">✕</button>
    </div>
    <input type="email" id="authEmailInput" class="search-input" placeholder="Your email (e.g. name@gmail.com)" style="margin-bottom: 6px;">
    <input type="password" id="authPassInput" class="search-input" placeholder="Password / Vault Key" style="margin-bottom: 8px;">
    <div style="display: flex; gap: 6px;">
      <button class="btn" id="submitAuthBtn" style="flex: 1; padding: 6px;">Sign In / Sign Up</button>
      <button class="btn btn-secondary" id="googleQuickAuthBtn" style="flex: 1; padding: 6px;">Google Sign-In</button>
    </div>
  </div>

  <!-- Mode Selector: Auto vs Manual -->
  <div class="mode-box">
    <div class="mode-segment">
      <button id="modeAutoBtn" class="mode-btn active">
        <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34d399;"></span>
        <span>⚡ Auto Mode</span>
      </button>
      <button id="modeManualBtn" class="mode-btn">
        <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #94a3b8;"></span>
        <span>👆 Manual Mode</span>
      </button>
    </div>
    <div class="mode-desc" id="modeDescription">
      ⚡ <strong>Auto Mode:</strong> Listens & auto-captures every new prompt & AI response in real-time.
    </div>
  </div>

  <!-- Actions Zone -->
  <div style="background: #11121b; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 11px; display: flex; align-items: center; gap: 6px; margin-bottom: 2px;" id="statusIndicator">
      <span id="statusDot" style="width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; display: inline-block;"></span>
      <span id="platformStatus" style="color: #94a3b8;">Scanning active AI tab...</span>
    </div>

    <!-- Button 1: Save Visible Chat -->
    <button class="btn" id="manualSaveBtn">
      📥 Capture Visible Chat
    </button>

    <!-- Button 2: Deep Clone & Auto-Scroll -->
    <button class="btn btn-clone" id="cloneChatBtn">
      🧬 Clone Entire Chat (Auto-Scroll & Capture All)
    </button>
    <div style="font-size: 10px; color: #94a3b8; text-align: center; line-height: 1.3;">
      Auto-scrolls top-to-bottom so no older user or AI message is missed.
    </div>
  </div>

  <!-- Inspector View (When item clicked) -->
  <div class="inspector" id="inspectorView">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <input type="text" id="editTitleInput" style="background: #11121b; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; padding: 4px 8px; color: #fff; font-size: 11px; font-weight: 700; width: 230px;" placeholder="Edit title...">
      <div style="display: flex; gap: 4px;">
        <button id="saveTitleBtn" style="background: #6366f1; border: none; color: white; padding: 3px 6px; border-radius: 4px; font-size: 10px; cursor: pointer;">Save</button>
        <button id="pinConvoBtn" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #f59e0b; padding: 3px 6px; border-radius: 4px; font-size: 10px; cursor: pointer;">📌 Pin</button>
        <button id="closeInspBtn" style="background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 12px;">✕</button>
      </div>
    </div>
    <div class="msg-box" id="inspBody">...</div>
    <div style="display: flex; gap: 6px; margin-bottom: 6px;">
      <button class="btn" id="copyInspLinkBtn" style="flex: 1; background: #4f46e5; padding: 7px 8px; font-size: 11px; font-weight: 600;">🔗 Copy Note Link</button>
      <button class="btn btn-secondary" id="openInspWebBtn" style="flex: 1; padding: 7px 8px; font-size: 11px;">🌐 View in Web</button>
    </div>
    <div style="display: flex; gap: 6px;">
      <button class="btn btn-secondary" id="copyInspContextBtn" style="flex: 1; padding: 6px 8px; font-size: 11px;">📋 Copy for ChatGPT</button>
      <button class="btn btn-secondary" id="deleteInspBtn" style="padding: 6px 8px; font-size: 11px; color: #f87171;">🗑️ Delete</button>
    </div>
  </div>

  <!-- Search & Tabs -->
  <input type="text" id="searchInput" class="search-input" placeholder="Search saved conversations...">
  <div class="tabs">
    <button class="tab-btn active" data-filter="all">All</button>
    <button class="tab-btn" data-filter="chatgpt">ChatGPT</button>
    <button class="tab-btn" data-filter="gemini">Gemini</button>
    <button class="tab-btn" data-filter="claude">Claude</button>
  </div>

  <!-- Saved Conversations List -->
  <div class="recent-list" id="recentList">
    <!-- Populated by popup.js -->
  </div>

  <!-- Web Dashboard & Sync Action -->
  <div style="display: flex; gap: 6px; margin-bottom: 12px;">
    <button class="btn btn-secondary" id="openDashboardBtn" style="font-size: 11px;">
      🚀 Open Web Dashboard
    </button>
    <button class="btn btn-secondary" id="exportAllBtn" style="font-size: 11px;">
      💾 Export JSON
    </button>
  </div>

  <div class="footer">
    <span style="color: #64748b; font-size: 10px;">Markbook Note · Local Only</span>
    <a href="#" id="syncStatus">Storage: OK</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
